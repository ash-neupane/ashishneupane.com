x needs a straw man — and so did our own roofline story", "points": ["The reference policy was agreement with GPT-6 Astra and Fable, not ground truth [[explainxfactcheck2026]]", "444x only appears against a reasoning model billing thousands of output tokens at $10–25/M", "Our own 265x prefill-vs-decode ratio compared against BATCH-1 decode — the same straw man", "Continuous batching at 64–256 compresses the real gap to ~10–30x", "Arithmetic intensity plus the collapse in output-token count jointly suffice. No breakthrough needed."]}, {"title": "Calibrated abstention is the product; speed is the marketing", "points": ["98.6% accuracy at 80% coverage on the job where raw accuracy LAGGED [[primeline2026]]", "A calibrated posterior over an enumerated type lets the caller do decision theory in ordinary code [[chow1970]]", "Every wrong answer carried hedged confidence — never 1.000 and wrong [[themsquared2026]]", "But calibration error spans 0.012 (yes/no) to 0.254 (rating scales) — 20x, worst on Score", "And Jev cannot abstain unless you hand-build an `unknown` option [[langfuse2026]]"]}, {"title": "Diffusion is a red herring; depth is the real ceiling", "points": ["Every discrete-diffusion LM still needs k denoising passes and still meters output [[nie2025]]", "Mercury, the commercial proof point, gets ~10x throughput, not 40–200x [[inception2025]]", "MDLM shows masked diffusion collapses into masked LM — the two framings meet at one step [[sahoo2024]]", "One pass gives a fixed serial budget equal to model DEPTH, ~10¹–10² [[merrill2023]]", "Field-confirmed: arithmetic and date logic \"stay in code\" [[paddo2026]]"]}, {"title": "Parallel questions means answers cannot condition on each other", "points": ["One shared read, N independent heads ⇒ answer 2 cannot see answer 1", "Conditional schemas need a second round trip, which eats the latency win", "\"Speculative fan-out\" in the docs is an architecture disclosure in product clothing [[typesafe2026j]]", "Real moat vs Llama Guard / ShieldGemma: arbitrary typed schema at inference time, zero-shot, no fine-tune [[inan2023]]"]}, {"title": "Jev is a neural predicate — the DeepProbLog kind", "points": ["A neural predicate grounds one symbolic atom with a learned distribution [[manhaeve2018]]", "Choice = n-ary, Noul = binary truth value, Score = ordered domain collapsed to an expectation", "NeurASP does it for answer-set programming, Scallop for Datalog, LTN as fuzzy truth [[yang2020]] [[li2023]]", "Kautz placement: `Symbolic[Neuro]` — same shape as AlphaGo's MCTS calling an eval net [[kautz2022]]", "But Kautz meant a solver with a calculus. Jev's is a TypeScript `if` — `Program[Neuro]` in substance [[delvecchio2025]]"]}, {"title": "\"The output space IS the type\" is Semantic Probabilistic Layers, degenerate case", "points": ["Semantic loss penalises constraint violation — soft, no guarantee [[xu2018]]", "SPL restricts the output layer's support by construction, so consistency is provable [[ahmed2022]]", "Jev's version is SPL where the constraint is just \"exactly one of k\"", "SPL's hard case is CORRELATED structured output — exactly what Jev's independent questions refuse"]}, {"title": "MYCIN already ran this experiment, and lost", "points": ["Certainty factors: a symbolic rule emitting a typed conclusion plus a number, 1975 [[shortliffe1975]]", "Heckerman & Shortliffe's stated motive: the rule-based approach \"required a modular approach to uncertainty management\" [[heckerman1992]]", "TypeSafe's docs: \"Ask each factor as a separate question, then combine the results with logic in your code\"", "Identical design, identical rationale, 34 years apart", "CFs were valid only under conditional independence, single hypothesis, non-shared evidence [[heckerman1986]]"]}, {"title": "Calibration is fixed at the leaf; composition is not", "points": ["A calibrated P(A|state) and P(B|state) do NOT determine P(A∧B|state)", "`if p_a > 0.8 and p_b > 0.7` rebuilds an EXTENSIONAL system out of intensional parts [[pearl1988]]", "Worse than MYCIN: its combiner was one published analysable function; Jev's is different in every codebase", "And the questions share a common cause — the same `state` — so errors correlate positively", "Naive multiplication is anti-conservative in exactly that regime [[horvitz1986modular]]"]}, {"title": "Independence is now a theorem, and it bites the calibration claim", "points": ["Independence-assuming neuro-symbolic losses are non-convex and BIAS toward overconfidence [[vankrieken2024]]", "Such models can never represent uncertainty over certain concept combinations [[vankrieken2025]]", "So the caller cannot recover joint uncertainty that was never represented", "Reasoning shortcuts: labels mean what training made them mean, not what your variable is named [[marconato2023]]", "With no joint training there is no mechanism to detect the drift"]}, {"title": "What a frozen API forfeits", "points": ["DeepProbLog is defined by gradients flowing back through weighted model counting [[manhaeve2018]]", "Abductive learning lets the logic REVISE wrongly perceived facts [[dai2019]]", "Jev is metered and frozen — nothing crosses the boundary in either direction", "The inference-time half of neuro-symbolic AI survives; the learning half, where the published benefit lives, does not", "It is the maximally functional, non-declarative neural predicate [[hinnerichs2024]]"]}, {"title": "\"System One\" is a pun, not an inheritance", "points": ["Bengio, SOFAI and LeCun's Mode-1/2 all require a METACOGNITIVE ARBITER [[bengio2019]] [[booch2021]]", "Jev has no System 2 and no arbiter — the arbiter is your `if` statement", "Kahneman's System 1 is characterised by systematic BIAS [[kahneman2011]]", "TypeSafe claims the opposite: more reliable because the output type is constrained", "LeCun's Mode-1 is amortised FROM Mode-2 planning; Jev is detached from any such process [[lecun2022]]"]}], "next_steps": ["Get a key; pin jev-1.13.0, never the jev-latest alias", "Build one async harness logging full probability vectors + usage + wall-clock to JSONL", "Run P5 token accounting first — minutes of compute, and the tokenizer fingerprint is high-value", "Run P1 (latency vs M) and P2 (latency vs cardinality) same day — together they are the discriminator", "Run P3 overnight: 2,000 repeats, and check whether the probability VECTOR is bit-identical", "Only rent a GPU for the reproduction after P1/P2 land", "Publish the scaling curves — nobody has; that is exactly where the architecture shows"], "ideas": [{"id": "P1", "question": "Does end-to-end latency scale flat, weakly-linear, or superlinear in question count M at fixed state?", "hypothesis": "Block-mask concatenation: linear in total question TOKENS with a small slope. Query slots: flat to M≈50. Token-emitting: clean linear, large slope.", "experiment": "Fixed 4,000-token state. M ∈ {1,2,5,10,20,50,100,200,400}, paraphrase-free copies of one question. 200 trials each, randomized order. Fit p50 against M and against total question tokens; see which regressor wins.", "why": "The single cleanest discriminator among the three ranked hypotheses. Nobody has published this curve."}, {"id": "P2", "question": "Does one question's latency depend on its enum cardinality (2 vs 16 vs 255 options)?", "hypothesis": "A head-based design is indifferent — one matmul row regardless of width. Anything emitting tokens pays for longer label strings and more mask work.", "experiment": "M=1, fixed state. Cardinality 2/4/8/16/64/255 with option labels of IDENTICAL token length (opt_001…opt_255). Repeat with 1-token labels to regress out option-token count. Also vary Score levels 2→10.", "why": "Orthogonal to P1; jointly they nearly settle the readout mechanism."}, {"id": "P3", "question": "What generates the 1.7–3.3% non-determinism on identical inputs?", "hypothesis": "Batch-composition floating-point jitter at near-ties. Flip rate should rise with server load and with the number of other questions in the same request.", "experiment": "2,000 repeats of one fixed (state, question) at three times of day. Log FULL probability vectors. Key tell: if the vector is bit-identical across repeats but argmax flips, it is sampling; if the vector itself jitters at ~1e-3, it is kernel/batching.", "why": "One line of analysis decides sampling vs kernel noise. A tail of flips at HIGH confidence would indicate MoE routing — the cheapest dense-vs-MoE test available."}, {"id": "P4", "question": "Is the model genuinely bidirectional, and is the context window 32k or 64k?", "hypothesis": "A bidirectional encoder shows a mild, roughly symmetric U over needle depth. A causal decoder shows strong recency bias.", "experiment": "Needle-in-haystack over 1k/4k/16k/32k states, needle at 10 depths, 50 needles. Measure accuracy AND mean confidence by depth. Also reorder JSON keys. Push past 32k and see whether it errors, truncates, or silently degrades.", "why": "Separates encoder from decoder and resolves the docs-vs-OpenRouter context contradiction in one run."}, {"id": "P5", "question": "What exactly is counted as input_tokens, and what is output_tokens when output is free?", "hypothesis": "input = tokenize(state) + Σ tokenize(question_i incl. option labels); output_tokens is cosmetic or a few per question.", "experiment": "Vary state length, question count, option count, label length independently; fit input_tokens as a linear model over all four. A non-zero per-question intercept reveals a template/slot prompt. Fingerprint the tokenizer family by finding strings where ModernBERT-vocab and cl100k counts disagree.", "why": "Cheapest experiment here, purely arithmetic, and a tokenizer fingerprint is strong architecture evidence."}, {"id": "P6", "question": "Does Jev fail exactly where a fixed-depth transformer must?", "hypothesis": "Graded failure on graph reachability as node count grows and on k-step arithmetic as k grows, while shallow pattern-matching at matched state length stays flat.", "experiment": "Synthetic suite in `state`: (a) reachability in a random DAG, n ∈ {5,10,20,40,80}, as a Noul; (b) k-step chained arithmetic, k ∈ 1..8; (c) control single-hop lookup. 300 items/cell. Plot accuracy and calibration vs n and k against a Haiku-class model with CoT.", "why": "A falsifiable structural prediction no marketing can move, and it says exactly which workloads never belong on Jev."}, {"id": "P7", "question": "Does the calibration advantage survive distribution shift?", "hypothesis": "ECE stays low in-domain and degrades markedly off it, but the accuracy-vs-coverage curve stays favorable.", "experiment": "One label schema, four input distributions: clean, typo'd, adversarially irrelevant padding, genuinely shifted domain. 500 items each. Report ECE, Brier, and the full risk-coverage curve; add split conformal for distribution-free coverage.", "why": "Calibration is the product and the least-verified claim — no published reliability curve exists anywhere."}, {"id": "R1", "question": "How much of Jev is reproducible on one rented GPU?", "hypothesis": "ModernBERT-base + block-mask question blocks + per-question softmax over option embeddings, trained multi-task with cross-entropy + a Brier term, reaches usable zero-shot typed classification at ECE < 0.10 with latency flat in M.", "experiment": "Single A100/H100, 24–48h. 30–60 public classification tasks (banking77, clinc150, TREC, goemotions, AG News, massive intents) reformatted as {state, question, enum options}; hold out 10 for zero-shot. Ablate the Brier weight λ ∈ {0, 0.1, 0.5}. Baselines: Yin-style NLI re-encoding per label, TF-IDF+LR, and a small instruct LM with constrained decoding.", "why": "Turns the speculation into an artifact. If a 150M encoder with block-mask heads is flat in M and calibrated zero-shot, the small-dense hypothesis becomes hard to argue against."}, {"id": "R2", "question": "Is the speed band fully explained by arithmetic intensity?", "hypothesis": "Measured prefill-vs-decode MFU ratio lands ~10–30x once decode uses continuous batching, not the ~265x that batch-1 decode implies.", "experiment": "One H100. Measure achieved TFLOP/s for a 3B-class encoder forward pass over 4k tokens at batch 32–256, versus autoregressive decode of the same model at batch 1 AND at batch 64–256. Report both ratios.", "why": "Converts the roofline argument from an assertion into a number, and checks whether our own correction to it holds."}, {"id": "O1", "question": "Is Jev dense or MoE, and how many parameters?", "why": "No paper, no weights, no ablations as of 2026-09-19. The 1–15B band rests on one equation with four assumptions — hardware generation, GPU price, MFU, and margin — and margin is the least defensible, since \"output FREE (too cheap to meter)\" says outright that pricing is not cost-based."}, {"id": "O2", "question": "What does RLCD concretely optimize?", "why": "RLCD (\"RL for Calibrated Decisions\") is NOT Damani's RLCR (\"RL with Calibration Rewards\") — that method trains reasoning models to emit a chain of thought plus a verbalized confidence, and Jev emits no reasoning tokens. The deflationary reading is stronger: when output is already a softmax over the type, cross-entropy is itself strictly proper, so the moat is outcome-labelled data at scale [[damani2025]] [[gneiting2007]]."}, {"id": "O3", "question": "How is the confidence statistic computed?", "why": "Undisclosed. Entropy-based, margin-based, or a learned head each imply a different training objective — and callers are being asked to threshold on it."}, {"id": "S1", "question": "Are the errors of independently-asked Jev questions over the same state actually correlated?", "hypothesis": "Strongly and positively — they share a common cause (the state), so naive multiplication of their probabilities is anti-conservative.", "experiment": "Pick a labelled set where two questions A and B have joint ground truth. Ask both over the same state, 2,000 items. Compare the empirical P(A∧B) against p_A·p_B. Report the ratio as a function of p_A. Repeat with a deliberately irrelevant second question as a control.", "why": "This single measurement decides whether the whole MYCIN parallel is load-bearing or decorative — and it is the number every Jev caller silently assumes."}, {"id": "S2", "question": "Can a provenance semiring recover sound composition over Jev's leaves?", "hypothesis": "Scallop-style composition over Jev-grounded atoms beats caller-side boolean logic on calibration of the COMPOSITE decision, without touching the model.", "experiment": "Wire Jev as the neural predicate behind a small Scallop or ProbLog program on a multi-hop task. Compare composite ECE and risk-coverage against the same decision computed with plain `and`/`or` in Python. No GPU needed.", "why": "Turns the critique constructive, and would be the first published demonstration of a frozen commercial API used as a neural predicate."}, {"id": "S3", "question": "Does conformal risk control fix what per-question calibration cannot?", "hypothesis": "Calibrating the composite decision end-to-end on held-out data gives a distribution-free risk guarantee that no amount of leaf calibration provides.", "experiment": "Take a pipeline combining 3-5 Jev questions. Apply split conformal risk control to the final decision; compare the realised risk against the nominal level, and against thresholding each question independently.", "why": "The actionable lesson for anyone building on Jev: calibrate the tree, not the leaf. [[angelopoulos2023crc]]"}, {"id": "S4", "question": "Do Jev's labels mean what the caller's schema says they mean?", "why": "Reasoning shortcuts are the known failure mode of grounded-symbol architectures: high task accuracy with concepts that carry unintended semantics. With no joint training and no gradient across the API boundary, a Jev caller has no mechanism to detect that the oracle grounded a different concept than the one the variable is named after [[marconato2023]] [[hinnerichs2024]]."}], "must_read": [{"id": "typesafe2026h", "why": "The 32k-for-state-plus-the-single-longest-question limit — the best architectural fingerprint in the public record."}, {"id": "manhaeve2018", "why": "The neural predicate. Jev's Choice/Noul/Score are this construct, productised and frozen."}, {"id": "heckerman1992", "why": "The field's own verdict on modular uncertainty, by the people who invented it. TypeSafe's rationale, 34 years earlier."}, {"id": "pearl1988", "why": "Extensional vs intensional. Why combining calibrated marginals in your code is the unsound part, not the model."}, {"id": "jaegle2021", "why": "Encode once, cross-attend N queries. The canonical statement of pay-the-stack-once-decode-many."}, {"id": "merrill2023", "why": "Log-precision transformers sit in uniform TC0. The ceiling one forward pass cannot cross."}], "report_quality": {"verdict": "MEDIUM", "verdict_note": "Qualitative architecture is robust; the parameter count is one equation wearing three hats.", "axes": [{"name": "Freshness", "score": 5, "note": "Every primary source ≤4 days old on a 4-day-old launch; academic spine at the frontier."}, {"name": "Accuracy", "score": 4, "note": "All 46 arXiv IDs verified correct against the arXiv API — zero hallucinated citations. But the founder's HN quote was misattributed and the Doom 'independent check' was algebraically circular; both corrected."}, {"name": "Reproducibility", "score": 2, "note": "Independent evidence is three single runs of n=60–300, no confidence intervals, no seeds, no weights, no paper."}, {"name": "Bias/Completeness", "score": 4, "note": "Correctly hostile to the marketing and fair to the product. A later pass added the symbolic-AI angle, which surfaced the composition critique the first four angles missed entirely."}, {"name": "Causal rigor", "score": 3, "note": "'Free output ⇒ no decode loop' is a clean inference from pricing to architecture; the 265x roofline identity was fitted post hoc and has been withdrawn."}, {"name": "Scale-transfer", "score": 3, "note": "Over-applied an asymptotic complexity result to a fixed 32k window; corrected to a quantitative depth-budget claim."}, {"name": "Falsifiability", "score": 5, "note": "Names cheap decisive experiments — latency vs M, latency vs cardinality, and the bit-identical-vector test — that separate every competing hypothesis."}]}};

/* ---------- shared helpers ---------- */
const BY = new Map(PAPERS.map(p => [p.id, p]));
const ANGLES = [];
PAPERS.forEach(p => { if (p.angle && !ANGLES.includes(p.angle)) ANGLES.push(p.angle); });
const ANGLE_TOKENS = ["a", "b", "c", "d", "e", "f", "g", "h"];
const LABEL_OVERRIDES = {
  "primary-sources": "SOURCES", "parallelism-mechanism": "MECHANISM",
  "typed-output-calibration": "CALIBRATION", "economics-limits": "ECONOMICS", "symbolic-ai": "SYMBOLIC"
};
const laneLabel = a => LABEL_OVERRIDES[a] || String(a).split(/[-_ ]/)[0].toUpperCase();
const ANGLE_LABEL = {}, ANGLE_COLOR = {};
ANGLES.forEach((a, i) => {
  ANGLE_LABEL[a] = laneLabel(a);
  ANGLE_COLOR[a] = `var(--angle-${ANGLE_TOKENS[i % ANGLE_TOKENS.length]})`;
});
const NODE_FILL = "#b9d0a6", NODE_STROKE = "#1d4a33";

const asList = v => Array.isArray(v) ? v : (typeof v === "string" ? v.split(/,\s*/) : []);
const authorsOf = p => { const a = asList(p.authors); return a.slice(0, 3).join(", ") + (a.length > 3 ? " et al." : ""); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function refs(text) {
  return esc(text)
    .replace(/`([^`]+)`/g, (m, code) => `<code>${code}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (m, b) => `<strong>${b}</strong>`)
    .replace(/\[\[([a-zA-Z0-9_.-]+)\]\]/g, (m, id) => {
    const p = BY.get(id);
    if (!p) return id;
    return `<a class="cite" href="${esc(p.url)}" target="_blank" rel="noopener" data-pid="${id}">${id}</a>`;
  });
}

/* ---------- header ---------- */
document.getElementById("rtitle").textContent = CONTENT.title;
document.getElementById("rquestion").textContent = CONTENT.question;
const nEdges = (CONTENT.stats && CONTENT.stats.edges) || PAPERS.reduce((s, p) => s + (p.cites || []).length, 0);
const nPapers = (CONTENT.stats && CONTENT.stats.papers) || PAPERS.length;
document.getElementById("rstats").textContent = `${nPapers} papers · ${nEdges} citation links · ${CONTENT.date}`;
document.getElementById("foot").textContent = `${CONTENT.title} · ${CONTENT.date}`;

/* ---------- citation popover ---------- */
const pop = document.getElementById("pop");
let popTimer = null;
function citeCount(p) {
  if (p.citation_count == null) return "";
  return `${p.citation_count_estimated ? "~" : ""}${p.citation_count} cites`;
}
function metaLine(p) {
  return [authorsOf(p), p.year, p.venue, citeCount(p)].filter(Boolean).map(esc).join(" · ");
}
function popHTML(p) {
  return `<div class="pt">${esc(p.title)}</div>
    <div class="pm">${metaLine(p)}</div>
    <div class="pc">${esc(p.key_claim)}</div>
    <a class="plink" href="${esc(p.url)}" target="_blank" rel="noopener">open source &#8599;</a>`;
}
function showPop(el, p) {
  clearTimeout(popTimer);
  pop.innerHTML = popHTML(p);
  pop.style.display = "block";
  const r = el.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + window.scrollX;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 12));
  let top = r.bottom + window.scrollY + 6;
  if (r.bottom + h + 20 > window.innerHeight) top = r.top + window.scrollY - h - 6;
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function hidePopSoon() { clearTimeout(popTimer); popTimer = setTimeout(() => pop.style.display = "none", 260); }
document.addEventListener("mouseover", e => {
  const c = e.target.closest(".cite");
  if (c && BY.get(c.dataset.pid)) showPop(c, BY.get(c.dataset.pid));
});
document.addEventListener("mouseout", e => { if (e.target.closest(".cite")) hidePopSoon(); });
pop.addEventListener("mouseenter", () => clearTimeout(popTimer));
pop.addEventListener("mouseleave", hidePopSoon);

/* ---------- TLDR ---------- */
document.getElementById("tldrList").innerHTML = CONTENT.tldr.map(item => {
  if (typeof item === "string") return `<li>${refs(item)}</li>`;
  return `<li>${refs(item.point)}<ul>${(item.sub || []).map(s => `<li>${refs(s)}</li>`).join("")}</ul></li>`;
}).join("");

/* ---------- insights carousel ---------- */
const car = document.getElementById("carousel"), dots = document.getElementById("dots");
car.innerHTML = CONTENT.insights.map((ins, i) =>
  `<div class="slide${i === 0 ? " on" : ""}"><h3>${refs(ins.title)}</h3><ul class="log">${ins.points.map(p => `<li>${refs(p)}</li>`).join("")}</ul></div>`).join("");
dots.innerHTML = CONTENT.insights.map((_, i) => `<button class="dot${i === 0 ? " on" : ""}" data-i="${i}" aria-label="insight ${i + 1}"></button>`).join("");
let curIns = 0;
function goIns(i) {
  curIns = (i + CONTENT.insights.length) % CONTENT.insights.length;
  car.querySelectorAll(".slide").forEach((s, k) => s.classList.toggle("on", k === curIns));
  dots.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("on", k === curIns));
}
dots.addEventListener("click", e => { const d = e.target.closest(".dot"); if (d) goIns(+d.dataset.i); });
document.getElementById("insPrev").onclick = () => goIns(curIns - 1);
document.getElementById("insNext").onclick = () => goIns(curIns + 1);

/* ---------- next steps ---------- */
document.getElementById("checks").innerHTML = CONTENT.next_steps
  .map(s => `<div class="checkrow"><span class="box"></span><span>${refs(s)}</span></div>`).join("");

/* ---------- idea deck ---------- */
const ideaEl = document.getElementById("ideaCard");
let curIdea = Math.floor(Math.random() * CONTENT.ideas.length);
function cell(lab, val) {
  return `<div class="cell"><div class="lab">${lab}</div><div class="val">${val ? refs(val) : "&mdash;"}</div></div>`;
}
function renderIdea() {
  const d = CONTENT.ideas[curIdea];
  const full = d.hypothesis || d.experiment;
  ideaEl.innerHTML = full
    ? `<div class="grid2">${cell("Research question", d.question)}${cell("Hypothesis", d.hypothesis)}${cell("Experiment", d.experiment)}${cell("Why it matters", d.why)}</div>`
    : `<div class="grid2" style="grid-template-columns:1fr">${cell("Open question", d.question)}${cell("Why it matters", d.why)}</div>`;
}
renderIdea();
document.getElementById("shuffleBtn").onclick = () => {
  let n = curIdea;
  while (n === curIdea && CONTENT.ideas.length > 1) n = Math.floor(Math.random() * CONTENT.ideas.length);
  curIdea = n; renderIdea();
};

/* ---------- report quality ---------- */
document.getElementById("qbars").innerHTML = CONTENT.report_quality.axes.map(a =>
  `<div class="qitem"><div class="qrow">
     <div class="qname">${esc(a.name)}</div>
     <div class="qtrack"><div class="qfill" style="width:${(a.score / 5) * 100}%"></div></div>
     <div class="qnum">${a.score}/5</div>
   </div><div class="qnote">${esc(a.note)}</div></div>`).join("");

/* ---------- references ---------- */
const MUST = (Array.isArray(CONTENT.must_read) && CONTENT.must_read.length
  ? CONTENT.must_read.filter(m => BY.has(m.id))
  : PAPERS.slice().sort((a, b) => (b.citation_count || 0) - (a.citation_count || 0)).slice(0, 5).map(p => ({ id: p.id })));
const MUST_IDS = new Set(MUST.map(m => m.id));
const REST = PAPERS.filter(p => !MUST_IDS.has(p.id)).sort((a, b) => (b.citation_count || 0) - (a.citation_count || 0));

function accHTML(p, why, marked) {
  return `<details class="acc${marked ? " must" : ""}"><summary>
      <span class="tt">${esc(p.title)}<span class="au">${esc(authorsOf(p))}</span>${why ? `<span class="why">${refs(why)}</span>` : ""}</span>
      ${marked ? '<span class="mustflag">must read</span>' : ""}
      <span class="yr">${p.year}</span></summary>
    <div class="accbody">${esc(p.key_claim)}
      <div class="meta">
        <span class="tag" style="background:${ANGLE_COLOR[p.angle] || "var(--muted)"}">${ANGLE_LABEL[p.angle] || esc(p.angle)}</span>
        ${p.venue ? `<span>${esc(p.venue)}</span>` : ""}
        ${p.citation_count == null ? "" : `<span>${citeCount(p)}${p.citation_count_estimated ? " (est.)" : ""}</span>`}
        ${asList(p.institutions)[0] ? `<span>${esc(asList(p.institutions)[0])}</span>` : ""}
        <a href="${esc(p.url)}" target="_blank" rel="noopener">open &#8599;</a>
      </div></div></details>`;
}

let refsExpanded = false;
function renderRefs() {
  const mustRows = MUST.map(m => accHTML(BY.get(m.id), m.why, refsExpanded)).join("");
  document.getElementById("accs").innerHTML = refsExpanded
    ? mustRows + REST.map(p => accHTML(p, null, false)).join("")
    : mustRows;
  document.getElementById("refcount").textContent = refsExpanded
    ? `${PAPERS.length} sources shown`
    : `${MUST.length} must-read${MUST.length === 1 ? "" : "s"} · ${PAPERS.length} total`;
  document.getElementById("refToggle").textContent = refsExpanded
    ? `\u2212 show must-reads only`
    : `+ expand all ${PAPERS.length}`;
}
renderRefs();
document.getElementById("refToggle").onclick = () => { refsExpanded = !refsExpanded; renderRefs(); };

/* ---------- sticky nav ---------- */
const SECS = [["tldr", "TLDR"], ["insights", "Insights"], ["graph", "Citation map"], ["timeline", "Timeline"],
  ["next", "Next steps"], ["ideas", "Idea deck"], ["quality", "Quality"], ["citations", "References"]];
const pills = document.getElementById("pills");
pills.innerHTML = SECS.map(([id, label], i) =>
  `<button class="pill${i === 0 ? " active" : ""}" data-id="${id}"><span class="n">${String(i + 1).padStart(2, "0")}</span>${label}</button>`).join("");
let curSec = 0;
function setSec(i, scroll) {
  curSec = Math.max(0, Math.min(SECS.length - 1, i));
  pills.querySelectorAll(".pill").forEach((p, k) => p.classList.toggle("active", k === curSec));
  const active = pills.children[curSec];
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
  if (scroll) document.getElementById(SECS[curSec][0]).scrollIntoView({ behavior: "smooth", block: "start" });
}
pills.addEventListener("click", e => { const p = e.target.closest(".pill"); if (p) setSec(SECS.findIndex(s => s[0] === p.dataset.id), true); });
document.getElementById("prevSec").onclick = () => setSec(curSec - 1, true);
document.getElementById("nextSec").onclick = () => setSec(curSec + 1, true);
function syncNav() {
  const navH = document.querySelector(".navbar").getBoundingClientRect().height;
  const line = navH + 12;
  let best = 0;
  SECS.forEach(([id], i) => {
    if (document.getElementById(id).getBoundingClientRect().top <= line) best = i;
  });
  const doc = document.documentElement;
  if (window.scrollY + window.innerHeight >= doc.scrollHeight - 4) best = SECS.length - 1;
  if (best !== curSec) setSec(best, false);
}
window.addEventListener("scroll", () => { if (!window.__navRaf) window.__navRaf = requestAnimationFrame(() => { window.__navRaf = 0; syncNav(); }); }, { passive: true });
syncNav();

/* ---------- edges ---------- */
const maxCite = d3.max(PAPERS, p => p.citation_count || 0) || 1;
const rScale = d3.scaleSqrt().domain([0, maxCite]).range([2.6, 9.5]);
const EDGES = [];
PAPERS.forEach(p => (p.cites || []).forEach(t => { if (BY.has(t)) EDGES.push({ s: p.id, t }); }));
const qScale = d3.scaleSqrt()
  .domain([0, d3.max(EDGES, e => Math.min(BY.get(e.s).citation_count || 0, BY.get(e.t).citation_count || 0)) || 1])
  .range([0.45, 3.2]);
const edgeW = e => qScale(Math.min(BY.get(e.s).citation_count || 0, BY.get(e.t).citation_count || 0));

/* ---------- hover card helper ---------- */
function makeCard(el) {
  let t = null;
  return {
    show(p, x, y) {
      clearTimeout(t);
      el.innerHTML = popHTML(p);
      el.style.display = "block";
      const w = el.offsetWidth, h = el.offsetHeight;
      const host = el.parentElement.getBoundingClientRect();
      el.style.left = Math.max(6, Math.min(x + 12, host.width - w - 6)) + "px";
      el.style.top = Math.max(6, Math.min(y - h / 2, host.height - h - 6)) + "px";
    },
    hide() { clearTimeout(t); t = setTimeout(() => el.style.display = "none", 280); },
    keep() { clearTimeout(t); }
  };
}

/* ---------- 5. citation graph on map ---------- */
(function () {
  const svg = d3.select("#mapsvg");
  const host = document.getElementById("mapsvg").parentElement;
  const W = host.clientWidth || 1000, H = Math.max(420, Math.min(600, Math.round(W * 0.62)));
  svg.attr("viewBox", `0 0 ${W} ${H}`).attr("height", H);

  const defs = svg.append("defs");
  defs.append("marker").attr("id", "arw").attr("viewBox", "0 -4 8 8")
    .attr("refX", 7).attr("refY", 0).attr("markerWidth", 5).attr("markerHeight", 5)
    .attr("orient", "auto").append("path").attr("d", "M0,-3.2L7,0L0,3.2").attr("fill", "#1d4a33").attr("opacity", .75);

  const g = svg.append("g");
  const gMap = g.append("g"), gEdge = g.append("g"), gNode = g.append("g");

  const proj = d3.geoMercator().scale(W / 6.4).translate([W / 2, H / 1.7]);
  const path = d3.geoPath(proj);

  const nodes = PAPERS.map(p => {
    const [x, y] = proj([p.lon, p.lat]) || [W / 2, H / 2];
    return Object.assign({ x, y, x0: x, y0: y }, p);
  });
  const nmap = new Map(nodes.map(n => [n.id, n]));
  d3.forceSimulation(nodes)
    .force("x", d3.forceX(d => d.x0).strength(0.9))
    .force("y", d3.forceY(d => d.y0).strength(0.9))
    .force("collide", d3.forceCollide(d => rScale(d.citation_count || 0) + 1.6).iterations(3))
    .stop().tick(220);

  const card = makeCard(document.getElementById("nodecard"));
  const cardEl = document.getElementById("nodecard");
  cardEl.addEventListener("mouseenter", card.keep);
  cardEl.addEventListener("mouseleave", card.hide);

  const zoom = d3.zoom().scaleExtent([0.6, 22]).on("zoom", e => {
    g.attr("transform", e.transform);
    gNode.selectAll("circle").attr("stroke-width", 1.1 / Math.sqrt(e.transform.k));
    gEdge.selectAll("path").attr("stroke-width", d => edgeW(d) / Math.sqrt(e.transform.k));
  });
  zoom.filter(e => e.type !== "wheel" || e.ctrlKey || e.metaKey);
  svg.call(zoom).on("dblclick.zoom", null);

  function drawEdges() {
    gEdge.selectAll("path").data(EDGES).join("path")
      .attr("fill", "none").attr("stroke", "#1d4a33").attr("stroke-opacity", .38)
      .attr("stroke-width", d => edgeW(d))
      .attr("marker-end", "url(#arw)")
      .attr("d", d => {
        const a = nmap.get(d.s), b = nmap.get(d.t);
        const dx = b.x - a.x, dy = b.y - a.y, dr = Math.hypot(dx, dy) * 1.9 || 1;
        if (Math.hypot(dx, dy) < 1) return null;
        return `M${a.x},${a.y}A${dr},${dr} 0 0,1 ${b.x},${b.y}`;
      });
  }

  function drawNodes() {
    gNode.selectAll("circle").data(nodes).join("circle")
      .attr("cx", d => d.x).attr("cy", d => d.y)
      .attr("r", d => rScale(d.citation_count || 0))
      .attr("fill", NODE_FILL).attr("stroke", NODE_STROKE).attr("stroke-width", 1.1)
      .style("cursor", "pointer")
      .on("mouseenter", function (e, d) {
        const r = host.getBoundingClientRect();
        card.show(d, e.clientX - r.left, e.clientY - r.top);
        d3.select(this).attr("fill", "#8fbb78");
      })
      .on("mouseleave", function () { card.hide(); d3.select(this).attr("fill", NODE_FILL); })
      .on("dblclick", (e, d) => {
        e.stopPropagation();
        svg.transition().duration(700).call(zoom.transform,
          d3.zoomIdentity.translate(W / 2, H / 2).scale(8).translate(-d.x, -d.y));
      });
  }

  function initialView(animate) {
    const focus = nodes.filter(n => n.lon >= -170 && n.lon <= 45);
    const xs = focus.map(n => n.x).sort(d3.ascending), ys = focus.map(n => n.y).sort(d3.ascending);
    const x0 = xs[0], x1 = xs[xs.length - 1], y0 = ys[0], y1 = ys[ys.length - 1];
    const k = Math.max(1.4, Math.min(3.2, (W - 70) / Math.max(40, x1 - x0), (H - 70) / Math.max(40, y1 - y0)));
    const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    if (animate) svg.transition().duration(600).call(zoom.transform, t);
    else svg.call(zoom.transform, t);
  }
  document.getElementById("resetMap").onclick = () => initialView(true);

  drawEdges(); drawNodes(); initialView(false);

  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(r => r.json())
    .then(topo => {
      const land = topojson.feature(topo, topo.objects.countries);
      gMap.selectAll("path").data(land.features).join("path")
        .attr("d", path).attr("fill", "var(--raised)")
        .attr("stroke", "#1d4a33").attr("stroke-width", 0.9).attr("vector-effect", "non-scaling-stroke");
      gMap.lower();
    })
    .catch(() => {})
    .finally(() => initialView(false));
})();

/* ---------- 6. 3-D timeline ---------- */
(function () {
  const svg = d3.select("#timesvg");
  const host = document.getElementById("timesvg").parentElement;
  const W = host.clientWidth || 1000, H = Math.max(440, Math.min(620, Math.round(W * 0.62)));
  svg.attr("viewBox", `0 0 ${W} ${H}`).attr("height", H);
  const g = svg.append("g").attr("transform", `translate(${W / 2},${H / 2 + 40})`);

  const YEARS = Array.from(new Set(PAPERS.map(p => p.year))).sort(d3.ascending);
  const years = [YEARS[0], YEARS[YEARS.length - 1]];
  const SXp = d3.scalePoint().domain(YEARS).range([-W * 0.34, W * 0.34]);
  const SX = y => SXp(YEARS.reduce((b, c) => Math.abs(c - y) < Math.abs(b - y) ? c : b, YEARS[0]));
  const SY = d3.scaleSqrt().domain([0, maxCite]).range([0, 210]);
  const LANE_SPAN = Math.min(150, 34 * Math.max(1, ANGLES.length - 1));
  const SZ = d3.scalePoint().domain(ANGLES).range([-LANE_SPAN, LANE_SPAN]);

  let yaw = -0.62, pitch = 0.52;
  function proj3(x, y, z) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const xr = x * cy - z * sy, zr = x * sy + z * cy;
    return { X: xr, Y: -y * cp + zr * sp, D: zr * cp + y * sp };
  }
  const P = p => proj3(SX(p.year), SY(p.citation_count || 0), SZ(p.angle) || 0);

  const gAxis = g.append("g"), gPill = g.append("g"), gEdge = g.append("g"), gNode = g.append("g"), gLab = g.append("g");
  const card = makeCard(document.getElementById("timecard"));
  const tcard = document.getElementById("timecard");
  tcard.addEventListener("mouseenter", card.keep);
  tcard.addEventListener("mouseleave", card.hide);

  function render() {
    // axes
    const axes = [];
    const y0 = 0;
    ANGLES.forEach(a => {
      const z = SZ(a);
      axes.push({ a: proj3(SX(years[0]), y0, z), b: proj3(SX(years[1]), y0, z), cls: "lane" });
    });
    axes.push({ a: proj3(SX(years[0]), 0, SZ(ANGLES[0])), b: proj3(SX(years[0]), SY(maxCite), SZ(ANGLES[0])), cls: "vert" });
    gAxis.selectAll("line").data(axes).join("line")
      .attr("x1", d => d.a.X).attr("y1", d => d.a.Y).attr("x2", d => d.b.X).attr("y2", d => d.b.Y)
      .attr("stroke", "#1d4a33").attr("stroke-opacity", .45)
      .attr("stroke-dasharray", d => d.cls === "lane" ? "3 4" : null).attr("stroke-width", 1);

    // lane labels + year ticks
    const labs = ANGLES.map(a => ({ t: ANGLE_LABEL[a], p: proj3(SX(years[0]) - 26, 0, SZ(a)), anchor: "end", col: "var(--muted)" }));
    YEARS.forEach((y, i) => {
      if (YEARS.length > 16 && i % 2 === 1 && i !== YEARS.length - 1) return;
      labs.push({ t: y, p: proj3(SX(y), -14, SZ(ANGLES[ANGLES.length - 1]) + 40), anchor: "middle", col: "var(--muted)" });
    });
    gLab.selectAll("text").data(labs).join("text")
      .attr("x", d => d.p.X).attr("y", d => d.p.Y).attr("text-anchor", d => d.anchor)
      .attr("font-family", "var(--mono)").attr("font-size", 9.5).attr("fill", d => d.col)
      .attr("dominant-baseline", "middle").text(d => d.t);

    // pillars
    gPill.selectAll("line").data(PAPERS).join("line")
      .attr("x1", d => proj3(SX(d.year), 0, SZ(d.angle)).X).attr("y1", d => proj3(SX(d.year), 0, SZ(d.angle)).Y)
      .attr("x2", d => P(d).X).attr("y2", d => P(d).Y)
      .attr("stroke", "#1d4a33").attr("stroke-opacity", .3).attr("stroke-width", 1);

    // edges
    gEdge.selectAll("line").data(EDGES).join("line")
      .attr("x1", d => P(BY.get(d.s)).X).attr("y1", d => P(BY.get(d.s)).Y)
      .attr("x2", d => P(BY.get(d.t)).X).attr("y2", d => P(BY.get(d.t)).Y)
      .attr("stroke", "#1d4a33").attr("stroke-opacity", .22).attr("stroke-width", d => edgeW(d));

    // nodes, painter's algorithm
    const sorted = PAPERS.slice().sort((a, b) => P(b).D - P(a).D);
    gNode.selectAll("circle").data(sorted, d => d.id).join("circle")
      .attr("cx", d => P(d).X).attr("cy", d => P(d).Y)
      .attr("r", d => rScale(d.citation_count || 0))
      .attr("fill", NODE_FILL).attr("stroke", NODE_STROKE).attr("stroke-width", 1.1)
      .style("cursor", "pointer")
      .on("mouseenter", (e, d) => { const r = host.getBoundingClientRect(); card.show(d, e.clientX - r.left, e.clientY - r.top); })
      .on("mouseleave", card.hide)
      .on("click", (e, d) => window.open(d.url, "_blank", "noopener"));
  }
  render();

  let base = null;
  svg.style("cursor", "grab").call(d3.drag()
    .on("start", e => { base = { yaw, pitch }; svg.style("cursor", "grabbing"); })
    .on("drag", e => {
      if (!base) return;
      yaw = base.yaw + (e.x - e.subject.x) * 0.006;
      pitch = Math.max(-0.2, Math.min(1.25, base.pitch + (e.y - e.subject.y) * 0.004));
      render();
    })
    .on("end", () => { base = null; svg.style("cursor", "grab"); }));
  document.getElementById("resetOrbit").onclick = () => { yaw = -0.62; pitch = 0.52; render(); };
})();
</script>
</body>
</html>
