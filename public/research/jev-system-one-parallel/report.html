<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Jev computes in parallel</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
:root {
  --sage: #a8ba9a;
  --surface: #c8d5bc;
  --raised: #d5e0ca;
  --ink: #0c2a1e;
  --bottle: #0c2a1e;
  --text2: #2c4034;
  --muted: #4d5d46;
  --border: #8fa17c;
  --on-ink: #d5e0ca;
  --background: var(--sage);
  --accent: var(--ink);
  --accent-text: var(--on-ink);
  --score: #2e6f47;
  --angle-a: #2e6f47;
  --angle-b: #a9701b;
  --angle-c: #b23a2e;
  --angle-d: #6b4a6e;
  --angle-e: #1f5f6b;
  --shadow-rgb: 12, 42, 30;
  --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Monaco, "Cascadia Mono", "Roboto Mono", "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --r-xs: 2px;
  --r-sm: 3px;
  --shadow-paper: 2px 3px 0 rgba(var(--shadow-rgb), 0.16);
  --shadow-button: 2px 3px 0 rgba(var(--shadow-rgb), 0.22);
  --shadow-pop: 3px 5px 0 rgba(var(--shadow-rgb), 0.20);
  --s1: 2px; --s2: 4px; --s3: 7px; --s4: 10px; --s5: 14px; --s6: 20px; --s7: 28px; --s8: 40px;
  --content-width: 1100px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--background); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: var(--content-width); margin: 0 auto; padding: 0 24px; }
a { color: var(--ink); }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: 34px; line-height: 1.15; }
h2 { font-size: 21px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 16px; }

header.top { padding: var(--s8) 0 var(--s6); }
.qcard {
  background: var(--raised); border: 1px solid var(--border);
  border-left: 5px solid var(--ink);
  box-shadow: var(--shadow-paper); border-radius: var(--r-sm);
  padding: var(--s5) var(--s6); margin-top: var(--s5);
  font-size: 15px; color: var(--text2);
}
.statline {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  margin-top: var(--s5); letter-spacing: 0.04em;
}

/* nav */
.navbar {
  position: sticky; top: 0; z-index: 60;
  background: var(--sage); border-bottom: 1px solid var(--border);
}
.navrow { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 24px; max-width: var(--content-width); margin: 0 auto; }
.pills { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; flex: 1; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em;
  text-transform: uppercase; white-space: nowrap;
  padding: 5px 9px; border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text2); cursor: pointer;
  transition: background .25s ease, color .25s ease, box-shadow .25s ease, transform .25s ease;
}
.pill:hover { background: var(--raised); }
.pill.active { background: var(--ink); color: var(--on-ink); border-color: var(--ink); box-shadow: var(--shadow-button); transform: translateY(-1px); }
.pill .n { opacity: .55; margin-right: 5px; }
.navarrow {
  font-family: var(--mono); font-size: 14px; line-height: 1;
  padding: 6px 9px; border: 1px solid var(--border); background: var(--surface);
  color: var(--ink); border-radius: var(--r-sm); cursor: pointer; box-shadow: var(--shadow-button);
  transition: background .2s ease;
}
.navarrow:hover { background: var(--raised); }

section { padding: var(--s8) 0 var(--s6); border-top: 1px dashed var(--border); }
section:first-of-type { border-top: none; }
.sechead { display: flex; align-items: baseline; gap: var(--s4); margin-bottom: var(--s5); }
.sechead .rule { flex: 1; border-bottom: 1px dashed var(--border); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-sm); box-shadow: var(--shadow-paper); padding: var(--s6);
}

/* tldr */
ul.log { list-style: none; margin: 0; padding: 0; }
ul.log > li { position: relative; padding-left: var(--s6); margin-bottom: var(--s4); }
ul.log > li::before { content: "▪"; position: absolute; left: 4px; color: var(--muted); font-size: 11px; top: 2px; }
ul.log ul { list-style: none; margin: var(--s3) 0 0; padding: 0; border-left: 1px dashed var(--border); }
ul.log ul li { position: relative; padding-left: var(--s6); margin: 0 0 var(--s3) var(--s2); color: var(--text2); font-size: 14px; }
ul.log ul li::before { content: "–"; position: absolute; left: 8px; color: var(--muted); }

code {
  font-family: var(--mono); font-size: 0.88em;
  background: var(--raised); border: 1px solid var(--border);
  border-radius: var(--r-xs); padding: 0 4px;
}

/* citation chip */
.cite {
  font-family: var(--mono); font-size: 11px; text-decoration: none;
  background: var(--raised); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: var(--r-xs); padding: 0 4px; color: var(--text2); white-space: nowrap;
}
.cite:hover { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

#pop {
  position: absolute; z-index: 200; width: 330px; max-width: 86vw; display: none;
  background: var(--raised); border: 1px solid var(--ink); border-radius: var(--r-sm);
  box-shadow: var(--shadow-pop); padding: var(--s5); font-size: 13px;
}
.pt { font-weight: 650; line-height: 1.3; margin-bottom: var(--s2); }
.pm { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: var(--s3); }
.pc { color: var(--text2); font-size: 12.5px; }
a.plink { display: inline-block; margin-top: var(--s3); font-family: var(--mono); font-size: 11px; color: var(--ink); }

/* carousel */
.carousel { min-height: 210px; }
.slide { display: none; }
.slide.on { display: block; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none; } }
.slide h3 { font-size: 20px; margin-bottom: var(--s5); line-height: 1.25; }
.dots { display: flex; justify-content: center; gap: var(--s3); margin-top: var(--s6); align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--border); background: var(--raised); cursor: pointer; padding: 0; transition: background .25s ease, transform .25s ease; }
.dot.on { background: var(--ink); border-color: var(--ink); transform: scale(1.25); }
.carnav { display: flex; justify-content: center; gap: var(--s4); margin-top: var(--s4); }

/* viz */
.viz { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); box-shadow: var(--shadow-paper); overflow: hidden; }
.viz svg { display: block; width: 100%; touch-action: pan-y; }
.vizbar { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; padding: var(--s3) var(--s5); border-bottom: 1px dashed var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.vizbar button { font-family: var(--mono); font-size: 11px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px 8px; cursor: pointer; color: var(--ink); }
#nodecard, #timecard {
  position: absolute; z-index: 150; width: 320px; max-width: 86vw; display: none;
  background: var(--raised); border: 1px solid var(--ink); border-radius: var(--r-sm);
  box-shadow: var(--shadow-pop); padding: var(--s5); font-size: 13px;
}
.relwrap { position: relative; }

/* checklist */
.checks { display: grid; gap: var(--s4); }
.checkrow { display: flex; gap: var(--s4); align-items: flex-start; }
.box { flex: none; width: 16px; height: 16px; margin-top: 2px; border: 2px solid var(--ink); border-radius: var(--r-xs); background: var(--raised); }

/* idea deck */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
.cell { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--s5); }
.cell .lab { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--s3); }
.cell .val { font-size: 13.5px; color: var(--text2); }
.shuffle {
  display: block; width: 100%; margin-top: var(--s6);
  font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
  padding: var(--s5); background: var(--ink); color: var(--on-ink);
  border: 1px solid var(--ink); border-radius: var(--r-sm); box-shadow: var(--shadow-button);
  cursor: pointer; transition: transform .15s ease;
}
.shuffle:active { transform: translate(2px, 3px); box-shadow: none; }

/* quality bars */
.qrow { display: grid; grid-template-columns: 150px 1fr 34px; gap: var(--s4); align-items: center; margin-bottom: var(--s4); }
.qname { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
.qtrack { height: 16px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-xs); position: relative; }
.qfill { height: 100%; background: var(--sage); border-right: 2px solid var(--score); transition: width .5s ease; }
.qnum { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.qnote { grid-column: 1 / -1; font-size: 12.5px; color: var(--text2); background: var(--raised); border-left: 3px solid var(--border); padding: var(--s3) var(--s4); display: none; }
.qitem:hover .qnote, .qitem:focus-within .qnote { display: block; }

/* references */
.refbar { display: flex; align-items: center; gap: var(--s5); margin-bottom: var(--s5); flex-wrap: wrap; }
.refcount { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.reftoggle {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase;
  padding: 5px 10px; background: var(--raised); border: 1px solid var(--ink);
  color: var(--ink); border-radius: var(--r-sm); box-shadow: var(--shadow-button); cursor: pointer;
}
.reftoggle:hover { background: var(--ink); color: var(--on-ink); }
.acc summary .why { display: block; font-size: 12.5px; color: var(--text2); font-weight: 400; margin-top: var(--s3); line-height: 1.45; }
.acc.must { border-left: 3px solid var(--ink); }
.mustflag { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--border); border-radius: var(--r-xs); padding: 1px 4px; white-space: nowrap; }

/* accordions */
.acc { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); margin-bottom: var(--s3); box-shadow: var(--shadow-paper); }
.acc summary { cursor: pointer; padding: var(--s4) var(--s5); list-style: none; display: flex; gap: var(--s4); align-items: baseline; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .tt { flex: 1; font-size: 14px; font-weight: 600; }
.acc summary .yr { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.acc summary .au { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; font-weight: 400; margin-top: 2px; }
.accbody { padding: 0 var(--s5) var(--s5); font-size: 13px; color: var(--text2); border-top: 1px dashed var(--border); padding-top: var(--s4); }
.meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: var(--s3); display: flex; gap: var(--s5); flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px; border-radius: var(--r-xs); color: var(--on-ink); }

footer { padding: var(--s8) 0; border-top: 1px dashed var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); }

@media (max-width: 720px) {
  h1 { font-size: 26px; }
  .wrap, .navrow { padding-left: 16px; padding-right: 16px; }
  .grid2 { grid-template-columns: 1fr; }
  .qrow { grid-template-columns: 96px 1fr 28px; }
  .qname { font-size: 10px; }
}
</style>
</head>
<body>
<div id="pop"></div>

<header class="top">
  <div class="wrap">
    <h1 id="rtitle"></h1>
    <div class="qcard" id="rquestion"></div>
    <div class="statline" id="rstats"></div>
  </div>
</header>

<nav class="navbar">
  <div class="navrow">
    <button class="navarrow" id="prevSec" aria-label="Previous section">&#9664;</button>
    <div class="pills" id="pills"></div>
    <button class="navarrow" id="nextSec" aria-label="Next section">&#9654;</button>
  </div>
</nav>

<main class="wrap">

<section id="tldr">
  <div class="sechead"><h2>TLDR</h2><div class="rule"></div></div>
  <div class="card"><ul class="log" id="tldrList"></ul></div>
</section>

<section id="insights">
  <div class="sechead"><h2>Key insights</h2><div class="rule"></div></div>
  <div class="card">
    <div class="carousel" id="carousel"></div>
    <div class="dots" id="dots"></div>
    <div class="carnav">
      <button class="navarrow" id="insPrev">&#9664;</button>
      <button class="navarrow" id="insNext">&#9654;</button>
    </div>
  </div>
</section>

<section id="graph">
  <div class="sechead"><h2>Citation map</h2><div class="rule"></div></div>
  <div class="viz relwrap">
    <div class="vizbar">
      <span>drag to pan &middot; &#8984;/ctrl + scroll to zoom &middot; double-click a node to focus</span>
      <button id="resetMap">reset view</button>
    </div>
    <svg id="mapsvg"></svg>
    <div id="nodecard"></div>
  </div>
</section>

<section id="timeline">
  <div class="sechead"><h2>Timeline</h2><div class="rule"></div></div>
  <div class="viz relwrap">
    <div class="vizbar">
      <span>x = year &middot; y = citations &middot; z = angle lane &middot; drag to orbit</span>
      <button id="resetOrbit">reset orbit</button>
    </div>
    <svg id="timesvg"></svg>
    <div id="timecard"></div>
    <div id="timecard"></div>
  </div>
</section>

<section id="next">
  <div class="sechead"><h2>Next steps</h2><div class="rule"></div></div>
  <div class="card"><div class="checks" id="checks"></div></div>
</section>

<section id="ideas">
  <div class="sechead"><h2>Idea deck</h2><div class="rule"></div></div>
  <div class="card">
    <div id="ideaCard"></div>
    <button class="shuffle" id="shuffleBtn">&#8635; shuffle</button>
  </div>
</section>

<section id="quality">
  <div class="sechead"><h2>Report quality</h2><div class="rule"></div></div>
  <div class="card" id="qbars"></div>
</section>

<section id="citations">
  <div class="sechead"><h2>References</h2><div class="rule"></div></div>
  <div class="refbar">
    <span class="refcount" id="refcount"></span>
    <button class="reftoggle" id="refToggle"></button>
  </div>
  <div id="accs"></div>
</section>

</main>
<footer><div class="wrap" id="foot"></div></footer>

al", "key_claim": "(B) 300 items/task: intent (77 classes) Jev 0.78 vs Terra 0.85; sentiment 0.57 vs 0.59; polarity 0.97 tie. ECE 0.11/0.08, 0.20/0.30, 0.04/0.02. Median latency ~0.20s vs ~1.04s; 41-50x cheaper. Non-determinism: identical inputs give different labels 1.7-3.3% of the time.", "relevance_to_question": "The most architecture-revealing independent result: measurable run-to-run non-determinism is in tension with a deterministic argmax classifier pass.", "angle": "primary-sources", "lat": 38.9, "lon": -77.04, "org_type": "independent", "cites": []}, {"id": "themsquared2026", "title": "jev-benchmark: agent tool-call risk classification", "authors": "themsquared", "institutions": "independent (GitHub)", "year": 2026, "venue": "GitHub repository", "citation_count": 0, "url": "https://github.com/themsquared/jev-benchmark", "key_claim": "(B) 60 hand-labeled cases (single run, 91.7% = 55/60, ~+/-7pp); 91.7% accuracy; p50 421.6ms / p95 542.0ms (latest), p50 378.5ms (preview); ~$0.0000173/call; every incorrect answer carried hedged confidence (0.130-0.785) - 'never returned 1.000 and was wrong'.", "relevance_to_question": "Independent confirmation of the latency band AND the strongest evidence the calibration claim survives outside contact - confidence is genuinely routable.", "angle": "primary-sources", "lat": 38.9, "lon": -77.04, "org_type": "independent", "cites": ["yin2019", "angelopoulos2023crc", "bates2021"]}, {"id": "langfuse2026", "title": "Using TypeSafe's Jev for evals", "authors": "Langfuse", "institutions": "Langfuse", "year": 2026, "venue": "Company engineering blog", "citation_count": 0, "url": "https://langfuse.com/blog/2026-09-18-using-typesafes-jev-for-evals", "key_claim": "(B) Confirms 255/10/binary primitive limits and the 64k-vs-32k discrepancy; ~27 output tokens in example; Good Start Labs 91.5% agreement with Fable 5.1 over 6,003 rubric checks at $160/M vs Fable $33,000/M; suffers 'context rot'; cannot explain or abstain.", "relevance_to_ques uts & Outputs", "authors": "Andrew Jaegle, Sebastian Borgeaud, Jean-Baptiste Alayrac, Carl Doersch, Catalin Ionescu, David Ding, Skanda Koppula, Daniel Zoran, Andrew Brock, Evan Shelhamer, Olivier Henaff, Matthew Botvinick, Andrew Zisserman, Oriol Vinyals, Joao Carreira", "institutions": "DeepMind", "year": 2021, "venue": "ICLR 2022", "citation_count": 916, "url": "https://arxiv.org/abs/2107.14795", "key_claim": "Encode any input into a fixed-size latent array with deep self-attention, then produce arbitrary structured outputs by cross-attending a query array - one query vector per output element - decoupling output size from the cost of the main computation.", "relevance_to_question": "STRONGEST candidate mechanism. Exactly reproduces 'latency flat in number of questions, cost linear only in question tokens'.", "angle": "parallelism-mechanism", "citation_count_estimated": false, "lat": 51.53, "lon": -0.12, "org_type": "industry", "cites": ["jaegle2021a", "austin2021", "devlin2019", "carion2020", "he2021", "khattab2020"]}, {"id": "jaegle2021a", "title": "Perceiver: General Perception with Iterative Attention", "authors": "Andrew Jaegle, Felix Gimeno, Andrew Brock, Andrew Zisserman, Oriol Vinyals, Joao Carreira", "institutions": "DeepMind", "year": 2021, "venue": "ICML", "citation_count": 1623, "url": "https://arxiv.org/abs/2103.03206", "key_claim": "Cross-attending a large input byte array into a small learned latent array decouples network depth cost from input size.", "relevance_to_question": "Establishes the latent-bottleneck half of the cost model: arbitrary-size program state compressed once into a fixed latent budget all questions share.", "angle": "parallelism-mechanism", "citation_count_estimated": false, "lat": 51.53, "lon": -0.12, "org_type": "industry", "cites": ["he2021", "lee2019", "devlin2019", "carion2020", "khattab2020", "austin2021"]}, {"id": "carion2020", "title": "End-to-End Object Detection with Transformers (DETR)", "authors": "Nicolas Carion, F ssifier.", "relevance_to_question": "Closest prior art in product shape; its FIXED taxonomy is exactly what Jev's arbitrary runtime schema improves on - the strongest case for novelty.", "angle": "economics-limits", "citation_count_estimated": false, "lat": 37.48, "lon": -122.15, "org_type": "industry", "cites": ["ouyang2022", "duda1976", "lee2019", "merrill2022"]}, {"id": "zeng2024", "title": "ShieldGemma: Generative AI Content Moderation Based on Gemma", "authors": "Wenjun Zeng, Yuchi Liu, Ryan Mullins, et al.", "institutions": "Google", "year": 2024, "venue": "arXiv:2407.21772", "citation_count": 240, "url": "https://arxiv.org/abs/2407.21772", "key_claim": "Suite of safety content-moderation classifiers, +10.8% AU-PRC over LlamaGuard via synthetic data generation.", "relevance_to_question": "Second prior-art anchor for classifier-as-a-service; establishes that small specialized classifiers beating general LLMs on decisions is a known, not novel, result.", "angle": "economics-limits", "citation_count_estimated": false, "lat": 37.42, "lon": -122.08, "org_type": "industry", "cites": ["inan2023", "duda1976", "lee2019", "li2024", "merrill2023", "merrill2022"]}, {"id": "kautz2022", "title": "The Third AI Summer: AAAI Robert S. Engelmore Memorial Lecture", "authors": "Henry A. Kautz", "institutions": "University of Rochester", "year": 2022, "venue": "AI Magazine 43(1)", "citation_count": 330, "url": "https://onlinelibrary.wiley.com/doi/10.1002/aaai.12036", "key_claim": "The six-category taxonomy of neuro-symbolic architectures. Symbolic[Neuro] = an overarching symbolic problem solver invoking neural models as internal subroutines (example: AlphaGo = MCTS + neural evaluation).", "relevance_to_question": "The classification frame. Jev lands in Symbolic[Neuro]: the caller's ordinary code is the solver, Jev the invoked neural subroutine. Rules out categories 4-6, which put the symbolic layer INSIDE the network - the exact opposite of the System One pitch.", "angle": "symbolic-ai", "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975", "howard1984"]}, {"id": "garcez2023", "title": "Neurosymbolic AI: The 3rd Wave", "authors": "Artur d'Avila Garcez, Luis C. Lamb", "institutions": "City University of London, UFRGS", "year": 2023, "venue": "Artificial Intelligence Review", "citation_count": 640, "url": "https://arxiv.org/abs/2012.05876", "key_claim": "Surveys the field and popularises Kautz's taxonomy; argues the next wave needs principled integration of neural learning with symbolic KR for trust, safety and explainability.", "relevance_to_question": "Canonical written-up source for the taxonomy, and the yardstick against which Jev's frozen-API integration is judged shallow or deep.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975", "howard1984"]}, {"id": "manhaeve2018", "title": "DeepProbLog: Neural Probabilistic Logic Programming", "authors": "Robin Manhaeve, Sebastijan Dumancic, Angelika Kimmig, Thomas Demeester, Luc De Raedt", "institutions": "KU Leuven, Ghent University-imec", "year": 2018, "venue": "NeurIPS 2018 / Artificial Intelligence 298 (2021)", "citation_count": 812, "url": "https://arxiv.org/abs/1805.10872", "key_claim": "Introduces the NEURAL PREDICATE: an annotated-disjunction fact whose probabilities over the groundings of a symbolic atom come from a neural network; ProbLog reasons over these by weighted model counting, and gradients flow back through that circuit into the network.", "relevance_to_question": "The single closest formal analogue to Jev. A Choice question IS an n-ary neural predicate, a Noul a binary one, a Score one over an ordered domain. Also the sharpest disanalogy: DeepProbLog's defining feature is the gradient crossing the neural/symbolic boundary, which a frozen paid API forecloses.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["le2017", "pearl1988", "richardson2006", "deraedt2007", "heckerman1986", "serafini2016"]}, {"id": "yang2020", "title": "NeurASP: Embracing Neural Networks into Answer Set Programming", "authors": "Zhun Yang, Adam Ishay, Joohyung Lee", "institutions": "Arizona State University", "year": 2020, "venue": "IJCAI 2020", "citation_count": 270, "url": "https://www.ijcai.org/proceedings/2020/243", "key_claim": "Treats neural network output as a probability distribution over atomic facts in an answer set program; a PRE-TRAINED network can be used in symbolic computation, and ASP reasoning can in turn improve the network's perception.", "relevance_to_question": "Closest precedent for a FROZEN network as symbol-grounding oracle - Jev's actual deployment mode. Also shows what Jev forfeits: the reverse direction, where symbolic reasoning corrects the neural output, is impossible through a black-box API.", "angle": "symbolic-ai", "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["pearl1988", "richardson2006", "andreas2016", "manhaeve2018", "heckerman1992", "serafini2016"]}, {"id": "li2023", "title": "Scallop: A Language for Neurosymbolic Programming", "authors": "Ziyang Li, Jiani Huang, Mayur Naik", "institutions": "University of Pennsylvania", "year": 2023, "venue": "PLDI 2023 / PACMPL 7(166)", "citation_count": 101, "url": "https://arxiv.org/abs/2304.04812", "key_claim": "A Datalog-based language with recursion, aggregation and negation made differentiable via PROVENANCE SEMIRINGS, which track the proofs of each fact rather than multiplying probabilities naively.", "relevance_to_question": "Shows what a real composition calculus over neural-predicate probabilities looks like, and is the missing layer between Jev's calibrated leaves and the caller's if-statements. The constructive fix for the composition problem.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 39.95, "lon": -75.19, "org_type": "academia", "cites": ["manhaeve2018", "garcez2023", "yang2020", "beurerkellner2023", "le2017", "kahneman2011"]}, {"id": "deraedt2007", "title": "ProbLog: A Probabilistic Prolog and Its Application in Link Discovery", "authors": "Luc De Raedt, Angelika Kimmig, Hannu Toivonen", "institutions": "KU Leuven, University of Helsinki", "year": 2007, "venue": "IJCAI 2007", "citation_count": 1500, "url": "https://www.ijcai.org/Proceedings/07/Papers/196.pdf", "key_claim": "Extends logic programs with probabilistically annotated facts under Sato's distribution semantics; inference reduces to weighted model counting on a weighted Boolean formula.", "relevance_to_question": "The substrate DeepProbLog extends, and the source of the requirement that grounded atom probabilities be semantically meaningful - the formal reason calibration matters rather than being a nicety.", "angle": "symbolic-ai", "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["pearl1988", "heckerman1986", "harnad1990", "richardson2006", "shortliffe1975", "howard1984"]}, {"id": "serafini2016", "title": "Logic Tensor Networks", "authors": "Luciano Serafini, Artur d'Avila Garcez, Samy Badreddine, Michael Spranger", "institutions": "FBK Trento, City University of London, Sony AI", "year": 2016, "venue": "NeSy 2016 / Artificial Intelligence 303 (2022)", "citation_count": 401, "url": "https://arxiv.org/abs/2012.13635", "key_claim": "Real Logic grounds first-order terms into real vectors and predicates into fuzzy [0,1] truth values via neural computation graphs, making logical formulas differentiable.", "relevance_to_question": "The fuzzy branch of grounding symbols in learned scalars. Jev's Noul is a [0,1] truth value for an atom, structurally an LTN grounding - but LTN's point is that formulas are differentiable, which Jev's frozen boundary negates.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["richardson2006", "pearl1988", "andreas2016", "heckerman1992", "kahneman2011", "harnad1990"]}, {"id": "richardson2006", "title": "Markov Logic Networks", "authors": "Matthew Richardson, Pedro Domingos", "institutions": "University of Washington", "year": 2006, "venue": "Machine Learning 62(1-2)", "citation_count": 4800, "url": "https://link.springer.com/article/10.1007/s10994-006-5833-1", "key_claim": "A first-order knowledge base with a weight on each formula defines a ground Markov network; inference by MCMC, weights learned by pseudo-likelihood.", "relevance_to_question": "The weights-on-formulas alternative to probabilities-on-atoms. MLN weights are not calibrated probabilities at all, showing 'learned number grounding a symbol' spans a range of semantic commitments - Jev picks the strictest.", "angle": "symbolic-ai", "lat": 47.66, "lon": -122.31, "org_type": "academia", "cites": ["pearl1988", "heckerman1992", "harnad1990", "shortliffe1975", "howard1984", "duda1976"]}, {"id": "xu2018", "title": "A Semantic Loss Function for Deep Learning with Symbolic Knowledge", "authors": "Jingyi Xu, Zilu Zhang, Tal Friedman, Yitao Liang, Guy Van den Broeck", "institutions": "UCLA, Peking University", "year": 2018, "venue": "ICML 2018", "citation_count": 573, "url": "https://arxiv.org/abs/1711.11157", "key_claim": "Derives from first principles a loss bridging neural output vectors and logical constraints, measuring how far the network is from satisfying the constraint.", "relevance_to_question": "The SOFT version of 'the output must respect the type': constraints are penalised, never guaranteed. The baseline against which Jev's by-construction claim is the stronger variant.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 34.07, "lon": -118.44, "org_type": "academia", "cites": ["kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975", "howard1984"]}, {"id": "ahmed2022", "title": "Semantic Probabilistic Layers for Neuro-Symbolic Learning", "authors": "Kareem Ahmed, Stefano Teso, Kai-Wei Chang, Guy Van den Broeck, Antonio Vergari", "institutions": "UCLA, University of Trento, University of Edinburgh", "year": 2022, "venue": "NeurIPS 2022", "citation_count": 131, "url": "https://arxiv.org/abs/2206.00426", "key_claim": "A drop-in predictive layer replacing sigmoid/softmax that GUARANTEES outputs consistent with prespecified logical constraints BY CONSTRUCTION, while modelling correlations over the structured output space and remaining end-to-end trainable.", "relevance_to_question": "The theoretical home of 'the output space IS the type'. Jev's guarantee is exactly SPL's, restricted to the trivial constraint 'exactly one of k'. The gap is diagnostic: SPL's hard case is CORRELATED structured output, which Jev's independent questions refuse.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 34.07, "lon": -118.44, "org_type": "academia", "cites": ["xu2018", "pearl1988", "deraedt2007", "manhaeve2018", "heckerman1986", "le2017"]}, {"id": "vankrieken2024", "title": "On the Independence Assumption in Neurosymbolic Learning", "authors": "Emile van Krieken, Pasquale Minervini, Edoardo M. Ponti, Antonio Vergari", "institutions": "University of Edinburgh", "year": 2024, "venue": "ICML 2024", "citation_count": 24, "url": "https://arxiv.org/abs/2404.08458", "key_claim": "Loss functions built on conditionally independent symbol probabilities are non-convex with highly disconnected minima, BIAS networks toward OVERCONFIDENCE, and cannot represent uncertainty over multiple valid options.", "relevance_to_question": "The most damaging single result for the pro-analogy case. Jev's questions are independent by architecture, so it adopts wholesale an assumption the field has formally indicted - and the indictment is specifically about overconfidence, the very property RLCD claims to fix.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 55.94, "lon": -3.19, "org_type": "academia", "cites": ["garcez2023", "li2023", "kahneman2011", "pearl1988", "harnad1990", "richardson2006"]}, {"id": "vankrieken2025", "title": "Neurosymbolic Reasoning Shortcuts under the Independence Assumption", "authors": "Emile van Krieken, Pasquale Minervini, Edoardo M. Ponti, Antonio Vergari", "institutions": "University of Edinburgh", "year": 2025, "venue": "arXiv:2507.11357 / NeSy 2025", "citation_count": 4, "url": "https://arxiv.org/abs/2507.11357", "key_claim": "Proves that assuming independence among symbolic concepts entails a model can never represent uncertainty over certain concept combinations, making independence-assuming predictors structurally unable to recognise their own reasoning shortcuts.", "relevance_to_question": "Settles the independence question: it is not merely an engineering limitation relocatable into caller code. A caller composing independent Jev marginals cannot recover joint uncertainty that was never represented.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 55.94, "lon": -3.19, "org_type": "academia", "cites": ["vankrieken2024", "marconato2023", "pearl1988", "shortliffe1975", "garcez2023", "dai2019"]}, {"id": "marconato2023", "title": "Not All Neuro-Symbolic Concepts Are Created Equal: Analysis and Mitigation of Reasoning Shortcuts", "authors": "Emanuele Marconato, Stefano Teso, Antonio Vergari, Andrea Passerini", "institutions": "University of Trento, University of Pisa, University of Edinburgh", "year": 2023, "venue": "NeurIPS 2023", "citation_count": 80, "url": "https://arxiv.org/abs/2305.19951", "key_claim": "Neuro-symbolic predictors suffer REASONING SHORTCUTS: high task accuracy while the learned concepts carry unintended semantics, so grounded symbols do not mean what the program assumes.", "relevance_to_question": "The deepest risk for a grounding-oracle architecture. Jev's Choice labels mean whatever RLCD training made them mean, not what the caller's variable name says - and with no joint training the caller cannot detect the drift.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 55.94, "lon": -3.19, "org_type": "academia", "cites": ["ahmed2022", "pearl1988", "shortliffe1975", "xu2018", "dai2019", "horvitz1986framework"]}, {"id": "dai2019", "title": "Bridging Machine Learning and Logical Reasoning by Abductive Learning", "authors": "Wang-Zhou Dai, Qiuling Xu, Yang Yu, Zhi-Hua Zhou", "institutions": "Nanjing University (LAMDA)", "year": 2019, "venue": "NeurIPS 2019", "citation_count": 420, "url": "https://papers.nips.cc/paper/8548-bridging-machine-learning-and-logical-reasoning-by-abductive-learning", "key_claim": "A learned model perceives primitive logical facts while logical reasoning ABDUCES and corrects wrongly perceived facts, the two trained in a mutually beneficial loop.", "relevance_to_question": "Jev's exact division of labour - learned perception, symbolic reasoning - but with the loop closed. Isolates what a frozen black-box API forfeits: the logic can never push a correction back into the perceiver.", "angle": "symbolic-ai", "lat": 32.06, "lon": 118.79, "org_type": "academia", "cites": ["pearl1988", "shortliffe1975", "horvitz1986framework", "gu2018", "kahneman2011", "harnad1990"]}, {"id": "harnad1990", "title": "The Symbol Grounding Problem", "authors": "Stevan Harnad", "institutions": "Princeton University", "year": 1990, "venue": "Physica D 42(1-3)", "citation_count": 6500, "url": "https://arxiv.org/abs/cs/9906002", "key_claim": "Asks how the semantic interpretation of a formal symbol system can be made intrinsic rather than parasitic on meanings in our heads; proposes grounding elementary symbols in learned nonsymbolic representations.", "relevance_to_question": "The philosophical charter for the whole 'learned oracle grounds a symbol' move. Jev sells exactly this service - a bought grounding for an atom in the caller's program.", "angle": "symbolic-ai", "lat": 40.34, "lon": -74.66, "org_type": "academia", "cites": ["pearl1988", "shortliffe1975", "howard1984", "duda1976", "horvitz1988", "heckerman1986"]}, {"id": "andreas2016", "title": "Neural Module Networks", "authors": "Jacob Andreas, Marcus Rohrbach, Trevor Darrell, Dan Klein", "institutions": "UC Berkeley", "year": 2016, "venue": "CVPR 2016", "citation_count": 1214, "url": "https://arxiv.org/abs/1511.02799", "key_claim": "Decomposes questions into linguistic substructure and dynamically assembles jointly-trained, freely composable TYPED neural modules into a deeper network per input.", "relevance_to_question": "The composable-typed-module ancestor of a set of typed Jev questions assembled by a program. Contrast: NMN modules are jointly trained TO BE composable and their composition is differentiable.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 37.87, "lon": -122.27, "org_type": "academia", "cites": ["pearl1988", "richardson2006", "heckerman1992", "kahneman2011", "harnad1990", "shortliffe1975"]}, {"id": "hinnerichs2024", "title": "Declarative Design of Neural Predicates in Neuro-Symbolic Systems", "authors": "Tilman Hinnerichs, Robin Manhaeve, Giuseppe Marra, Sebastijan Dumancic", "institutions": "TU Delft, KU Leuven", "year": 2024, "venue": "arXiv:2405.09521", "citation_count": 1, "url": "https://arxiv.org/abs/2405.09521", "key_claim": "Neural predicates inherit the FUNCTIONAL (fixed input-to-output direction) nature of neural nets and therefore break the declarativeness of the host logic; proposes fully declarative neural predicates answering arbitrary queries.", "relevance_to_question": "Names Jev's structural limitation from inside the neuro-symbolic literature. Jev is maximally functional - state in, marginal out, one direction, no querying backwards - the non-declarative neural predicate this paper argues against.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 38.9, "lon": -77.04, "org_type": "independent", "cites": ["ahmed2022", "marconato2023", "pearl1988", "duda1976", "khattab2023", "horvitz1988"]}, {"id": "delvecchio2025", "title": "Neuro-Symbolic Artificial Intelligence: A Task-Directed Survey in the Black-Box Models Era", "authors": "Giovanni Pio Delvecchio, Lorenzo Molfetta, Gianluca Moro", "institutions": "University of Bologna", "year": 2025, "venue": "IJCAI 2025 Survey Track", "citation_count": 5, "url": "https://www.ijcai.org/proceedings/2025/1157.pdf", "key_claim": "Kautz's taxonomy assumed access to model internals and explicit knowledge representation, and must be revised for systems integrating opaque API-only foundation models as neurosymbolic components.", "relevance_to_question": "The most current taxonomic authority for Jev's exact situation, and the reason the honest verdict is 'Symbolic[Neuro] in topology, a category Kautz did not anticipate in substance'.", "angle": "symbolic-ai", "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["horvitz1988", "ahmed2022", "marconato2023", "hinnerichs2024", "lecun2022", "xu2018"]}, {"id": "shortliffe1975", "title": "A Model of Inexact Reasoning in Medicine", "authors": "Edward H. Shortliffe, Bruce G. Buchanan", "institutions": "Stanford University", "year": 1975, "venue": "Mathematical Biosciences 23", "citation_count": 2600, "url": "https://www.sciencedirect.com/science/article/abs/pii/0025556475900474", "key_claim": "Introduces CERTAINTY FACTORS: a modular numeric confidence attached to each rule conclusion, presented as an approximation to conditional probability with claimed advantages over Bayesian analysis inside MYCIN.", "relevance_to_question": "The load-bearing historical precedent. A symbolic rule engine emitting typed conclusion + number is structurally Jev's API, adopted for the same stated reason: modularity under an unbuildable joint model.", "angle": "symbolic-ai", "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": []}, {"id": "duda1976", "title": "Subjective Bayesian Methods for Rule-Based Inference Systems", "authors": "Richard O. Duda, Peter E. Hart, Nils J. Nilsson", "institutions": "SRI International", "year": 1976, "venue": "AFIPS National Computer Conference", "citation_count": 1200, "url": "https://www.sri.com/wp-content/uploads/2021/12/671.pdf", "key_claim": "PROSPECTOR's inference network updates the odds on a hypothesis as a product of likelihood ratios, valid under conditional independence of evidence given both H and not-H.", "relevance_to_question": "The principled contemporary alternative to certainty factors. Shows the independence assumption Jev's callers make implicitly was once made explicitly and named.", "angle": "symbolic-ai", "lat": 38.9, "lon": -77.04, "org_type": "independent", "cites": ["shortliffe1975"]}, {"id": "heckerman1986", "title": "Probabilistic Interpretations for MYCIN's Certainty Factors", "authors": "David E. Heckerman", "institutions": "Stanford University", "year": 1986, "venue": "UAI 1986", "citation_count": 425, "url": "https://arxiv.org/abs/1304.3419", "key_claim": "Certainty factors are a monotone transform of the likelihood ratio, and MYCIN's combination rules are probabilistically valid ONLY under conditional independence given H and not-H, for a single hypothesis, with non-shared evidence.", "relevance_to_question": "States precisely what went wrong with modular uncertainty. Every condition it names is violated when several Jev answers conditioned on the same shared state are combined.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["shortliffe1975", "howard1984", "duda1976"]}, {"id": "horvitz1986modular", "title": "Modular Belief Updates and Confusion about Measures of Certainty in AI Research", "authors": "Eric J. Horvitz, David E. Heckerman", "institutions": "Stanford University", "year": 1986, "venue": "UAI 1986", "citation_count": 3, "url": "https://arxiv.org/abs/1304.3103", "key_claim": "Formalizes modularity - an update independent of prior evidence. The likelihood ratio is the modular update, and only under conditional independence. MYCIN and INTERNIST-I implicitly assumed modularity while using measures of ABSOLUTE belief, which are not modular.", "relevance_to_question": "The cleanest statement of the exact flaw. Jev's 'every question is evaluated independently' is a modularity assumption, and the caller's arithmetic is modular combination over non-modular quantities.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["heckerman1986", "shortliffe1975", "howard1984", "duda1976", "horvitz1986framework"]}, {"id": "horvitz1986framework", "title": "A Framework for Comparing Alternative Formalisms for Plausible Reasoning", "authors": "Eric J. Horvitz, David E. Heckerman, Curtis P. Langlotz", "institutions": "Stanford University", "year": 1986, "venue": "AAAI-86", "citation_count": 400, "url": "https://aaai.org/papers/00210-AAAI86-034-a-framework-for-comparing-alternative-formalisms-for-plausible-reasoning/", "key_claim": "A small set of intuitive desiderata for any measure of belief logically ENTAILS the axioms of probability theory; non-probabilistic calculi therefore violate one of the intuitive properties.", "relevance_to_question": "Establishes there is no third option: an uncertainty scheme is either probabilistic or gives up something you wanted. Jev complies at the leaf; caller-side combination does not.", "angle": "symbolic-ai", "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["shortliffe1975", "howard1984", "duda1976", "heckerman1986"]}, {"id": "heckerman1992", "title": "From Certainty Factors to Belief Networks", "authors": "David E. Heckerman, Edward H. Shortliffe", "institutions": "USC, Stanford School of Medicine", "year": 1992, "venue": "Artificial Intelligence in Medicine 4(1)", "citation_count": 800, "url": "https://www.microsoft.com/en-us/research/wp-content/uploads/2016/11/From-Certainty-Factors-to-Belief-Networks.pdf", "key_claim": "Delineates the CF model's theoretical and practical limitations and shows belief networks overcome them; notes the AI community 'has largely abandoned the use of CFs'. States the original motive: 'the rule-based approach they were developing required a MODULAR approach to uncertainty management'.", "relevance_to_question": "The field's own verdict on the modular-uncertainty design, written by its inventors. The stated motive for certainty factors is verbatim TypeSafe's motive for per-question independence, 34 years apart.", "angle": "symbolic-ai", "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["heckerman1986", "horvitz1986modular", "pearl1988", "harnad1990", "shortliffe1975", "howard1984"]}, {"id": "pearl1988", "title": "Probabilistic Reasoning in Intelligent Systems: Networks of Plausible Inference", "authors": "Judea Pearl", "institutions": "UCLA", "year": 1988, "venue": "Morgan Kaufmann", "citation_count": 32000, "citation_count_estimated": true, "url": "https://dl.acm.org/doi/book/10.5555/534975", "key_claim": "Distinguishes EXTENSIONAL systems (uncertainty as a truth value on formulas, combined truth-functionally - cheap but semantically sloppy) from INTENSIONAL systems (uncertainty over states of affairs); Bayesian networks make independence structure explicit to regain tractability without abandoning probability.", "relevance_to_question": "The sharpest available criticism of Jev. Calibrated per-question marginals are intensional leaves; a caller combining them with boolean logic in application code has rebuilt an extensional system - the thing Pearl argued must be abandoned.", "angle": "symbolic-ai", "lat": 34.07, "lon": -118.44, "org_type": "academia", "cites": ["duda1976", "horvitz1986framework", "shortliffe1975", "heckerman1986", "howard1984", "horvitz1986modular"]}, {"id": "howard1984", "title": "Influence Diagrams", "authors": "Ronald A. Howard, James E. Matheson", "institutions": "Stanford University, SRI", "year": 1984, "venue": "Readings on the Principles and Applications of Decision Analysis II; repr. Decision Analysis 2(3) 2005", "citation_count": 2400, "url": "https://pubsonline.informs.org/doi/10.1287/deca.1050.0020", "key_claim": "A compact graphical representation uniting chance nodes, decision nodes and a value (utility) node, with a well-defined solution procedure.", "relevance_to_question": "Names exactly what Jev ships and omits: chance nodes with calibrated marginals, while the caller must supply the decision node, the utility, and the dependency structure - the last of which the API cannot express.", "angle": "symbolic-ai", "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["shortliffe1975", "duda1976"]}, {"id": "horvitz1988", "title": "Decision Theory in Expert Systems and Artificial Intelligence", "authors": "Eric J. Horvitz, John S. Breese, Max Henrion", "institutions": "Stanford KSL, Rockwell, CMU", "year": 1988, "venue": "International Journal of Approximate Reasoning 2", "citation_count": 900, "url": "https://www.microsoft.com/en-us/research/publication/decision-theory-expert-systems-artificial-intelligence/", "key_claim": "Surveys the decision-theoretic framework for representation, inference, knowledge engineering and explanation in expert systems, following analyses of the restrictions of traditional AI uncertainty techniques.", "relevance_to_question": "The canonical statement of the decision-theoretic expert system programme Jev implicitly revives, with the utility half delegated to the calling application.", "angle": "symbolic-ai", "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["pearl1988", "duda1976", "shortliffe1975", "howard1984", "heckerman1986", "horvitz1986framework"]}, {"id": "kahneman2011", "title": "Thinking, Fast and Slow", "authors": "Daniel Kahneman", "institutions": "Princeton University", "year": 2011, "venue": "Farrar, Straus and Giroux", "citation_count": 85000, "citation_count_estimated": true, "url": "https://en.wikipedia.org/wiki/Thinking,_Fast_and_Slow", "key_claim": "Dual-process account: System 1 is fast, automatic, associative and error-prone; System 2 is slow, effortful, deliberate, and monitors/overrides System 1.", "relevance_to_question": "Source of TypeSafe's branding, and the inversion matters: Kahneman's System 1 is characterised by systematic BIAS, whereas TypeSafe claims System One becomes more reliable by constraining the output type.", "angle": "symbolic-ai", "lat": 40.34, "lon": -74.66, "org_type": "academia", "cites": ["pearl1988", "harnad1990", "richardson2006", "shortliffe1975", "howard1984", "deraedt2007"]}, {"id": "bengio2019", "title": "The Consciousness Prior / From System 1 Deep Learning to System 2 Deep Learning", "authors": "Yoshua Bengio", "institutions": "Mila, Universite de Montreal", "year": 2019, "venue": "NeurIPS 2019 keynote; arXiv:1709.08568", "citation_count": 273, "url": "https://arxiv.org/abs/1709.08568", "key_claim": "Argues the path from System 1 (intuitive, non-linguistic, habitual) to System 2 (sequential, conscious, algorithmic) runs through attention and a sparse factor-graph prior over high-level concepts.", "relevance_to_question": "The academic origin of System 1/2 vocabulary in ML. Bengio's System 1 FEEDS a System 2 mechanism; Jev has no System 2, so the branding borrows the term without the architecture.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 45.53, "lon": -73.61, "org_type": "academia", "cites": ["heckerman1992", "kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975"]}, {"id": "booch2021", "title": "Thinking Fast and Slow in AI", "authors": "Grady Booch, Francesco Fabiano, Lior Horesh, Kiran Kate, Jon Lenchner, Nick Linck, Andrea Loreggia, Keerthiram Murugesan, Nicholas Mattei, Francesca Rossi, Biplav Srivastava", "institutions": "IBM Research, University of Parma, Tulane", "year": 2021, "venue": "AAAI-21", "citation_count": 138, "url": "https://arxiv.org/abs/2010.06002", "key_claim": "Proposes the SOFAI multi-agent architecture in which fast System-1 solvers give constant-time experience-based answers and a METACOGNITIVE ARBITER deliberately activates slow System-2 solvers when needed.", "relevance_to_question": "The literature's definition of a System-1 component includes an autonomous metacognitive arbiter. Jev externalises arbitration to a hand-written threshold in caller code - the weakest point of the System One claim.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 38.9, "lon": -77.04, "org_type": "academia", "cites": ["kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975", "howard1984"]}, {"id": "lecun2022", "title": "A Path Towards Autonomous Machine Intelligence", "authors": "Yann LeCun", "institutions": "Meta AI, NYU", "year": 2022, "venue": "OpenReview position paper", "citation_count": 2300, "url": "https://openreview.net/pdf?id=BZ5a1r-kVsf", "key_claim": "A modular cognitive architecture with configurator, world model and cost module, operating in Mode-1 (reactive, amortised) and Mode-2 (deliberative planning through the world model).", "relevance_to_question": "Mode-1 is explicitly an amortised policy DISTILLED from Mode-2 planning. Jev resembles a Mode-1 module detached from any Mode-2 process, sharpening the question of where its correctness signal comes from.", "angle": "symbolic-ai", "lat": 37.48, "lon": -122.15, "org_type": "industry", "cites": ["horvitz1988", "dai2019", "gu2018", "kahneman2011", "pearl1988", "harnad1990"]}, {"id": "khattab2023", "title": "DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines", "authors": "Omar Khattab, Arnav Singhvi, Paridhi Maheshwari, Zhiyuan Zhang, Keshav Santhanam, Matei Zaharia, Christopher Potts", "institutions": "Stanford, UC Berkeley, CMU, Databricks", "year": 2023, "venue": "arXiv:2310.03714 / ICLR 2024", "citation_count": 1007, "url": "https://arxiv.org/abs/2310.03714", "key_claim": "Abstracts LM pipelines as imperative computation graphs of declarative modules; a SIGNATURE is a natural-language typed function declaration specifying what a transformation does rather than how to prompt for it, and a compiler optimises the pipeline against a metric.", "relevance_to_question": "The closest modern ancestor of Jev's typed-question API. Key contrast: DSPy keeps the pipeline as a first-class object it can compile and optimise end to end; Jev's composition lives in opaque caller code and cannot be optimised or audited.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 37.43, "lon": -122.17, "org_type": "academia", "cites": ["yang2020", "kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975"]}, {"id": "beurerkellner2023", "title": "Prompting Is Programming: A Query Language for Large Language Models", "authors": "Luca Beurer-Kellner, Marc Fischer, Martin Vechev", "institutions": "ETH Zurich", "year": 2023, "venue": "PLDI 2023", "citation_count": 219, "url": "https://arxiv.org/abs/2212.06094", "key_claim": "Language Model Programming generalises prompting to text plus scripting with declarative constraints enforced eagerly during decoding via token-level masks.", "relevance_to_question": "The competing route to type safety - constrain the decoder - against Jev's route of making the type the codomain itself. Useful for judging how novel 'invalid output is nonexistent' really is.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 47.38, "lon": 8.55, "org_type": "academia", "cites": ["manhaeve2018", "yang2020", "le2017", "kwon2023", "willard2023", "kahneman2011"]}, {"id": "gao2022", "title": "PAL: Program-aided Language Models", "authors": "Luyu Gao, Aman Madaan, Shuyan Zhou, Uri Alon, Pengfei Liu, Yiming Yang, Jamie Callan, Graham Neubig", "institutions": "Carnegie Mellon University", "year": 2022, "venue": "arXiv:2211.10435 / ICML 2023", "citation_count": 835, "url": "https://arxiv.org/abs/2211.10435", "key_claim": "The LM emits a PROGRAM rather than a free-form rationale, and the solution step is offloaded to a deterministic interpreter, decomposing natural-language understanding from computation.", "relevance_to_question": "The explicit argument that arithmetic and serial logic belong in code, not the model - exactly what Jev forces. Jev is the logical endpoint of PAL's division of labour.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 40.44, "lon": -79.94, "org_type": "academia", "cites": ["kahneman2011", "pearl1988", "harnad1990", "richardson2006", "shortliffe1975", "howard1984"]}, {"id": "le2017", "title": "Inference Compilation and Universal Probabilistic Programming", "authors": "Tuan Anh Le, Atilim Gunes Baydin, Frank Wood", "institutions": "University of Oxford", "year": 2017, "venue": "AISTATS 2017", "citation_count": 152, "url": "https://arxiv.org/abs/1610.09900", "key_claim": "Compiles a probabilistic program into a trained neural network that at test time performs approximate inference by proposing distributions for latent variables given observed data - amortising inference into a forward pass.", "relevance_to_question": "Jev is functionally an AMORTISED INFERENCE ORACLE: one forward pass, posterior out. The decisive difference is that inference compilation's oracle sits inside a generative program that DEFINES the joint; Jev ships the oracle with no program around it.", "angle": "symbolic-ai", "citation_count_estimated": false, "lat": 51.75, "lon": -1.26, "org_type": "academia", "cites": ["pearl1988", "deraedt2007", "duda1976", "heckerman1986", "kahneman2011", "harnad1990"]}, {"id": "angelopoulos2023crc", "title": "Conformal Risk Control", "authors": "Anastasios N. Angelopoulos, Stephen Bates, Adam Fisch, Lihua Lei, Tal Schuster", "institutions": "UC Berkeley, MIT, Stanford, Google Research", "year": 2023, "venue": "ICLR 2024 / arXiv:2208.02814", "citation_count": 370, "url": "https://arxiv.org/abs/2208.02814", "key_claim": "Extends const CONTENT = {"id": "jev-system-one-parallel", "title": "How Jev computes in parallel", "question": "How does Jev — TypeSafe AI's \"System One\" model — achieve parallel computation, and what is the most defensible speculation about its underlying architecture?", "date": "2026-09-19", "stats": {"papers": 122, "edges": 552}, "tldr": ["One bidirectional forward pass over a shared `state`, with N typed softmax heads. No decode loop anywhere.", {"point": "Best-fit mechanism: block-diagonal attention mask over `[state; q1; q2; … qN]`", "sub": ["Each question block attends to the state and itself, never to another question", "Fingerprint: the documented limit is 32k for state + the single LONGEST question [[typesafe2026h]]", "That asymmetry is exactly what a block mask produces — and Perceiver-IO does not predict it [[jaegle2021]]"]}, "Free output is the diagnostic. A softmax over an enumerated type has no marginal compute to meter.", {"point": "In symbolic-AI terms: a frozen **neural predicate** sold without the calculus", "sub": ["Kautz `Symbolic[Neuro]` — your code is the solver, Jev the invoked subroutine [[kautz2022]]", "Choice = n-ary neural predicate, Noul = binary, Score = ordered-domain [[manhaeve2018]]", "Calibration fixed at the leaf; composition left to your `if` statements [[pearl1988]]"]}, "255 options is a head width, not a vocabulary. Score = probability-weighted mean of level indices [[typesafe2026f]].", "Settled: no autoregressive decode. Open: dense vs MoE, parameter count, what RLCD concretely optimizes.", "\"Cannot hallucinate\" is a codomain property. It cost ~6 accuracy points [[typesafe2026a]]."], "insights": [{"title": "The 32k limit is the best architectural fingerprint in the public record", "points": ["Docs: 64k per request, of which 32k is state + the single LONGEST question [[typesafe2026h]]", "Not \"state + all questions\" — the per-question context is what a block mask gives", "Perceiver-IO's output query is a latent vector, so question
